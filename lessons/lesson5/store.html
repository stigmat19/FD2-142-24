<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>

    <style>
        
        h1 span{
            color: red;
        }
        #app{
            margin: 20px auto;
            display: flex;
            width: 950px;
            justify-content: space-between;
            flex-flow: wrap;
        }
        .card{
            margin-bottom: 20px;
        }
    </style>

</head>
<body>
    <input type="text" id="input" onchange="test()">
    <button onclick="handleUp()">up</button> <br>
    <button>down</button>
    <div id="app"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        const app = document.getElementById('app');
        const input = document.getElementById('input');
        const cars = [
            {
                brand: 'bmw',
                model: 'x5',
                color: 'black',
                year: 2020,
                price: 200,
                imgUrl: 'https://www.bmw.by/content/dam/bmw/common/all-models/m-series/series-overview/bmw-m-series-seo-overview-ms-04.jpg'
            },
            {
                brand: 'audi',
                model: 'q8',
                color: 'red',
                year: 2022,
                price: 300,
                imgUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Audi_A7_Sportback_Genf_2018.jpg/458px-Audi_A7_Sportback_Genf_2018.jpg'
            },
            {
                brand: 'mers',
                model: 'GLS',
                color: 'blue',
                year: 2021,
                price: 100,
                imgUrl: 'https://avatars.mds.yandex.net/get-vertis-journal/4466156/2020-09-24-b5cd5bc95c344d2caa5eb7e984b80e34.jpg_1622736693885/orig'
            },
        ];


        const createCardapp = (data) => {
            const img = document.createElement('img');
            img.src = data.imgUrl;
            img.className = 'card-img-top';

            const h5 = document.createElement('h5');
            h5.textContent = data.brand;
            h5.className = 'card-title';

            const cardBody = document.createElement('div');
            cardBody.className = 'card-body';

            const card = document.createElement('div');
            card.className = 'card';
            card.style.width = '18rem';

            cardBody.appendChild(img);
            cardBody.appendChild(h5);
            card.appendChild(cardBody);
            app.appendChild(card);
        }

        function render(parent, arr){
            for(let i=0; i<arr.length; i++){
                createCardapp(arr[i]);
            }
        }

        render(app, cars)

        const up = (cars) => {
            const sortCars = cars.sort((a,b) => {
                return a.price - b.price
            })

            render(app, sortCars)
        } 

        const handleUp = () => {
            up(cars);
        } 

        const test = () => {
            console.log('----1', input.value)
            const filteredCars = cars.filter(car => car.brand === input.value);
            render(app, filteredCars)
        }


        
    </script>

</body>
</html>
